<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقارنة الوحدات | Side-by-Side Compare</title>
    <link rel="stylesheet" href="property-compare.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="compare-container">
        <h2>مقارنة الوحدات المختارة</h2>
        <div class="grid">
            <div class="card">
                <h3>الوحدة A-101</h3>
                <p>المساحة: 150م²</p>
                <p>السعر: 3.2M ج.م</p>
                <p>الفيو: حديقة</p>
            </div>
            <div class="card">
                <h3>الوحدة B-204</h3>
                <p>المساحة: 185م²</p>
                <p>السعر: 4.1M ج.م</p>
                <p>الفيو: المسبح الرئيسي</p>
            </div>
        </div>
    </div>
    <script src="property-compare.js"></script>
</body>
</html>
